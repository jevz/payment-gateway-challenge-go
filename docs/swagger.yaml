basePath: /
definitions:
  api.pong:
    properties:
      message:
        type: string
    type: object
  handlers.errorResponse:
    properties:
      error_message:
        type: string
      errors:
        items:
          $ref: '#/definitions/payment.FieldError'
        type: array
      payment_id:
        type: string
      retryable:
        type: boolean
      status:
        type: string
    type: object
  models.GetPaymentResponse:
    properties:
      amount:
        type: integer
      card_number_last_four:
        type: string
      currency:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
      id:
        type: string
      payment_status:
        type: string
    type: object
  models.PostPaymentRequest:
    properties:
      amount:
        type: integer
      card_number:
        type: string
      currency:
        type: string
      cvv:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
    type: object
  models.PostPaymentResponse:
    properties:
      amount:
        type: integer
      card_number_last_four:
        type: string
      currency:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
      id:
        type: string
      payment_status:
        type: string
    type: object
  payment.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8090
info:
  contact: {}
  description: Interview challenge for building a Payment Gateway - Go version
  title: Payment Gateway Challenge Go
paths:
  /api/payments:
    post:
      consumes:
      - application/json
      description: Validates the request, sends it to the acquiring bank and stores
        the result.
      parameters:
      - description: Optional key that makes retries safe
        in: header
        name: Idempotency-Key
        type: string
      - description: Payment request
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/models.PostPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Authorized or Declined
          schema:
            $ref: '#/definitions/models.PostPaymentResponse'
        "202":
          description: Duplicate Idempotency-Key still in flight; poll GET /api/payments/{id}
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "400":
          description: Failed validation; the bank was not called
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "422":
          description: Idempotency-Key reused with a different body
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "502":
          description: Bank unavailable or timed out
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Process a card payment
      tags:
      - payments
  /api/payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GetPaymentResponse'
        "404":
          description: No payment with this ID
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Retrieve a payment
      tags:
      - payments
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pong'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
